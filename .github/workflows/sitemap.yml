name: Sitemap Güncelle

on:
  push:
    branches: [ main ]
  schedule:
    # Push olmasa bile tarihlerin (changefreq/lastmod) tazeliği için haftada bir
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log ile doğru lastmod tarihleri için tam geçmiş gerekiyor

      - name: Sitemap oluştur
        run: python3 scripts/generate_sitemap.py

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml zaten güncel, commit gerekmiyor."
          else
            git config user.name "nart-sitemap-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: sitemap.xml otomatik güncellendi [skip ci]"
            git push
          fi
