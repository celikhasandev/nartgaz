name: Nart Gaz Web Deploy

on:
  push:
    branches: ["main"]

# GitHub'a sayfayı internette yayınlaması için açıkça tam yazma izni veriyoruz
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Tüm html dosyalarını paketler

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
