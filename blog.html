<style>
  .nart-blog-hero-text{text-align:center;}
  .nart-blog-hero-text p{color:rgba(255,255,255,0.75);}

  .nart-blog-section{padding-top:56px;padding-bottom:100px;}

  .nart-blog-list{display:flex;flex-direction:column;gap:20px;max-width:880px;margin:0 auto;}
  .nart-blog-card{
    background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(20,30,60,0.07);
    transition:transform .22s ease, box-shadow .22s ease;display:flex;align-items:stretch;
    text-decoration:none;
  }
  .nart-blog-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,30,60,0.12);}
  .nart-blog-card-img{
    width:160px;min-width:160px;height:160px;object-fit:cover;background:#eef2f6;
  }
  .nart-blog-card-img-placeholder{
    width:160px;min-width:160px;height:160px;background:linear-gradient(135deg,#eef2f6,#dbe3ee);
    display:flex;align-items:center;justify-content:center;color:#b7c0cf;font-size:28px;
  }
  .nart-blog-card-body{padding:18px 22px;display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0;}
  .nart-blog-card-date{font-size:12.5px;color:#8a93a6;margin-bottom:6px;}
  .nart-blog-card-title{font-size:18px;font-weight:700;margin-bottom:6px;color:#1c2536;line-height:1.35;}
  .nart-blog-card-summary{
    font-size:14px;color:#5b657e;line-height:1.55;margin-bottom:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  @media (max-width:560px){
    .nart-blog-card{flex-direction:column;}
    .nart-blog-card-img, .nart-blog-card-img-placeholder{width:100%;height:170px;}
  }

  .nart-blog-empty{text-align:center;color:#8a93a6;padding:60px 0 40px;font-size:16px;}

  .nart-blog-pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:44px;flex-wrap:wrap;}
  .nart-page-btn{
    min-width:38px;height:38px;padding:0 12px;border-radius:9px;border:1px solid #e3e8ee;background:#fff;
    color:#3a445a;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .nart-page-btn:hover{border-color:#42adf0;color:#42adf0;}
  .nart-page-btn.active{background:#42adf0;border-color:#42adf0;color:#fff;}
  .nart-page-btn:disabled{opacity:.4;cursor:not-allowed;}
  .nart-page-btn:disabled:hover{border-color:#e3e8ee;color:#3a445a;}
</style>
</head>
<body>

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-57S4DCLQ"

<div id="nart-header"></div>

<section class="hero-section" style="padding:170px 0 70px;">
  <div class="container">
    <div class="hero-content nart-blog-hero-text mb-0">
      <h1 class="mb-20">Nart Gaz Blog</h1>
      <p style="max-width:640px;margin:0 auto;padding:0;"
        data-en="Up-to-date content on industrial gas systems, RMS stations, maintenance and industry developments."
        data-ru="Актуальные материалы о промышленных газовых системах, станциях РРД, техническом обслуживании и отраслевых новостях."
        data-ar="محتوى محدث حول أنظمة الغاز الصناعية، محطات تنظيم الضغط، الصيانة والتطورات في القطاع."
        data-zh="关于工业燃气系统、调压站、维护保养及行业动态的最新内容。"
        data-es="Contenido actualizado sobre sistemas industriales de gas, estaciones RMS, mantenimiento y novedades del sector."
        data-it="Contenuti aggiornati su sistemi industriali del gas, stazioni RMS, manutenzione e novità del settore."
        data-hi="औद्योगिक गैस प्रणालियों, आरएमएस स्टेशनों, रखरखाव और उद्योग में हुए विकास से जुड़ी नवीनतम जानकारी।"
      >Endüstriyel gaz sistemleri, RMS istasyonları, bakım-onarım ve sektörel gelişmeler hakkında güncel içerikler.</p>
    </div>
  </div>
</section>

<section class="container nart-blog-section">
  <div id="nart-blog-list" class="nart-blog-list"></div>
  <div id="nart-blog-empty" class="nart-blog-empty" style="display:none;"
    data-en="No blog posts have been published yet."
    data-ru="Пока нет опубликованных статей блога."
    data-ar="لا توجد تدوينات منشورة بعد."
    data-zh="目前还没有发布博客文章。"
    data-es="Todavía no se ha publicado ninguna entrada de blog."
    data-it="Non è stato ancora pubblicato alcun articolo del blog."
    data-hi="अभी तक कोई ब्लॉग पोस्ट प्रकाशित नहीं हुई है।"
  >Henüz yayınlanmış bir blog yazısı bulunmuyor.</div>
  <div id="nart-blog-pagination" class="nart-blog-pagination"></div>
</section>

<div id="nart-footer"></div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/wow.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
var PAGE_SIZE = 10;
var allPosts = [];
var currentPage = 1;

fetch('blog-posts.json?t=' + Date.now())
  .then(function(res){ return res.json(); })
  .then(function(posts){
    if (!posts) posts = [];
    // İleri tarihli (henüz yayın zamanı gelmemiş) yazıları listeden gizle.
    // Tarih geldiğinde ziyaretçinin tarayıcısı bunu otomatik algılayıp gösterir,
    // hiçbir işlem/deploy gerekmez.
    var todayStr = new Date().toISOString().slice(0, 10);
    posts = posts.filter(function(p){ return !p.date || p.date <= todayStr; });

    if (posts.length === 0) {
      document.getElementById('nart-blog-empty').style.display = 'block';
      return;
    }
    posts.sort(function(a, b){ return new Date(b.date) - new Date(a.date); });
    allPosts = posts;
    renderPage(1);
  })
  .catch(function(err){
    var emptyEl = document.getElementById('nart-blog-empty');
    emptyEl.style.display = 'block';
    emptyEl.setAttribute('data-en', 'There was a problem loading the blog posts.');
    emptyEl.setAttribute('data-ru', 'Произошла ошибка при загрузке статей блога.');
    emptyEl.setAttribute('data-ar', 'حدثت مشكلة أثناء تحميل مقالات المدونة.');
    emptyEl.setAttribute('data-zh', '加载博客文章时出现问题。');
    emptyEl.setAttribute('data-es', 'Se produjo un problema al cargar las entradas del blog.');
    emptyEl.setAttribute('data-it', 'Si è verificato un problema durante il caricamento degli articoli del blog.');
    emptyEl.setAttribute('data-hi', 'ब्लॉग पोस्ट लोड करते समय एक समस्या हुई।');
    emptyEl.textContent = 'Blog yazıları yüklenirken bir sorun oluştu.';
    if (typeof nartDiliUygula === 'function') {
      nartDiliUygula(localStorage.getItem('nart_secilen_dil') || 'tr');
    }
    console.error(err);
  });

function renderPage(page){
  currentPage = page;
  var list = document.getElementById('nart-blog-list');
  list.innerHTML = '';
  var start = (page - 1) * PAGE_SIZE;
  var pagePosts = allPosts.slice(start, start + PAGE_SIZE);

  pagePosts.forEach(function(post){
    var card = document.createElement('a');
    card.className = 'nart-blog-card';
    card.href = 'blog/' + post.slug + '.html';
    var img = post.image
      ? '<img class="nart-blog-card-img" src="' + post.image + '" alt="' + post.title + '" loading="lazy">'
      : '<div class="nart-blog-card-img-placeholder">📰</div>';
    var titleAttrs = '', summaryAttrs = '';
    if (post.i18n) {
      Object.keys(post.i18n).forEach(function(lang){
        var t = post.i18n[lang];
        if (t.title) titleAttrs += ' data-' + lang + '="' + t.title.replace(/"/g, '&quot;') + '"';
        if (t.summary) summaryAttrs += ' data-' + lang + '="' + t.summary.replace(/"/g, '&quot;') + '"';
      });
    }
    card.innerHTML =
      img +
      '<div class="nart-blog-card-body">' +
        '<div class="nart-blog-card-date">' + (post.dateDisplay || post.date) + '</div>' +
        '<div class="nart-blog-card-title"' + titleAttrs + '>' + post.title + '</div>' +
        '<div class="nart-blog-card-summary"' + summaryAttrs + '>' + (post.summary || '') + '</div>' +
      '</div>';
    list.appendChild(card);
  });

  renderPagination();

  // Kartlar sayfa yüklendikten SONRA eklendiği için, site genelindeki dil motorunu
  // (main.js) burada manuel tetikliyoruz ki mevcut dil seçimi karta da uygulansın.
  if (typeof nartDiliUygula === 'function') {
    nartDiliUygula(localStorage.getItem('nart_secilen_dil') || 'tr');
  }
  window.scrollTo({ top: document.querySelector('.nart-blog-section').offsetTop - 30, behavior: 'smooth' });
}

function renderPagination(){
  var wrap = document.getElementById('nart-blog-pagination');
  var totalPages = Math.ceil(allPosts.length / PAGE_SIZE);
  wrap.innerHTML = '';
  if (totalPages <= 1) return;

  var prev = document.createElement('button');
  prev.className = 'nart-page-btn';
  prev.textContent = '‹';
  prev.disabled = currentPage === 1;
  prev.onclick = function(){ if (currentPage > 1) renderPage(currentPage - 1); };
  wrap.appendChild(prev);

  for (var i = 1; i <= totalPages; i++) {
    (function(pageNum){
      var btn = document.createElement('button');
      btn.className = 'nart-page-btn' + (pageNum === currentPage ? ' active' : '');
      btn.textContent = pageNum;
      btn.onclick = function(){ renderPage(pageNum); };
      wrap.appendChild(btn);
    })(i);
  }

  var next = document.createElement('button');
  next.className = 'nart-page-btn';
  next.textContent = '›';
  next.disabled = currentPage === totalPages;
  next.onclick = function(){ if (currentPage < totalPages) renderPage(currentPage + 1); };
  wrap.appendChild(next);
}
</script>

</body>
</html>
